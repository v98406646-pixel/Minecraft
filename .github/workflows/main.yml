data class MinecraftVersionEntry(
    val id: String,
    val type: String,
    val url: String
)

enum class GameInputAction(val label: String, val lwjglCode: String) {
    MOVE_FORWARD("W", "GLFW_KEY_W"),
    MOVE_BACK("S", "GLFW_KEY_S"),
    MOVE_LEFT("A", "GLFW_KEY_A"),
    MOVE_RIGHT("D", "GLFW_KEY_D"),
    JUMP("SPACE", "GLFW_KEY_SPACE"),
    SNEAK("SHIFT", "GLFW_KEY_LEFT_SHIFT"),
    ATTACK_LMB("ЛКМ", "GLFW_MOUSE_BUTTON_LEFT"),
    USE_RMB("ПКМ", "GLFW_MOUSE_BUTTON_RIGHT"),
    INVENTORY("INV", "GLFW_KEY_E")
}

interface TouchInputBridge {
    fun onGameActionStateChanged(action: GameInputAction, isPressed: Boolean)
}

class MobileGameTouchButton @JvmOverloads constructor(
    context: Context,
    private val gameAction: GameInputAction = GameInputAction.MOVE_FORWARD,
    private val inputBridge: TouchInputBridge? = null
) : AppCompatButton(context) {

    private var isCurrentlyPressed = false

    init {
        text = gameAction.label
        textSize = 12f
        setTextColor(Color.WHITE)
        applyVisualState(false)
    }

    override fun onTouchEvent(event: MotionEvent): Boolean {
        when (event.actionMasked) {
            MotionEvent.ACTION_DOWN, MotionEvent.ACTION_POINTER_DOWN -> {
                setPressedState(true)
                return true
            }
            MotionEvent.ACTION_UP, MotionEvent.ACTION_POINTER_UP, MotionEvent.ACTION_CANCEL -> {
                setPressedState(false)
                return true
            }
        }
        return super.onTouchEvent(event)
    }

    override fun onWindowFocusChanged(hasWindowFocus: Boolean) {
        super.onWindowFocusChanged(hasWindowFocus)
        if (!hasWindowFocus) {
            setPressedState(false)
        }
    }

    fun forceRelease() {
        setPressedState(false)
    }

    private fun setPressedState(pressed: Boolean) {
        if (isCurrentlyPressed == pressed) return
        isCurrentlyPressed = pressed
        isPressed = pressed
        applyVisualState(pressed)
        inputBridge?.onGameActionStateChanged(gameAction, pressed)
    }

    private fun applyVisualState(pressed: Boolean) {
        background = GradientDrawable().apply {
            cornerRadius = 24f
            setColor(if (pressed) Color.parseColor("#C084FC") else Color.parseColor("#CC3B0764"))
            setStroke(3, if (pressed) Color.WHITE else Color.parseColor("#D8B4FE"))
        }
        setTextColor(if (pressed) Color.parseColor("#140724") else Color.WHITE)
    }
}

class MojangPackageDownloader(
    private val gameDir: File,
    private val httpClient: OkHttpClient = defaultClient()
) {
    companion object {
        const val MANIFEST_V2_URL = "https://piston-meta.mojang.com/mc/game/version_manifest_v2.json"
        const val ASSETS_BASE_URL = "https://resources.download.minecraft.net"
        private const val BUFFER_SIZE = 16 * 1024

        fun defaultClient(): OkHttpClient = OkHttpClient.Builder()
            .connectTimeout(20, TimeUnit.SECONDS)
            .readTimeout(30, TimeUnit.SECONDS)
            .writeTimeout(30, TimeUnit.SECONDS)
            .retryOnConnectionFailure(true)
            .build()
    }

    fun fetchVersionList(): List<MinecraftVersionEntry> {
        val jsonText = downloadText(MANIFEST_V2_URL)
        val versionsArray: JSONArray = JSONObject(jsonText).getJSONArray("versions")
        val list = ArrayList<MinecraftVersionEntry>(versionsArray.length())
        for (i in 0 until versionsArray.length()) {
            val item = versionsArray.getJSONObject(i)
            list.add(
                MinecraftVersionEntry(
                    id = item.getString("id"),
                    type = item.getString("type"),
                    url = item.getString("url")
                )
            )
        }
        return list
    }

    fun prepareVersionPackages(
        versionEntry: MinecraftVersionEntry,
        onStatus: (percent: Int, message: String) -> Unit
    ) {
        val versionDir = File(gameDir, "versions/${versionEntry.id}")
        val librariesDir = File(gameDir, "libraries")
        val assetsIndexesDir = File(gameDir, "assets/indexes")
        val assetsObjectsDir = File(gameDir, "assets/objects")

        versionDir.mkdirs()
        librariesDir.mkdirs()
        assetsIndexesDir.mkdirs()
        assetsObjectsDir.mkdirs()

        onStatus(5, "Скачивание JSON версии ${versionEntry.id}...")
        val versionJsonFile = File(versionDir, "${versionEntry.id}.json")
        val versionJsonText = downloadText(versionEntry.url)
        versionJsonFile.writeText(versionJsonText, Charsets.UTF_8)
        val versionJson = JSONObject(versionJsonText)

        val clientObj = versionJson.getJSONObject("downloads").getJSONObject("client")
        val clientJarFile = File(versionDir, "${versionEntry.id}.jar")
        onStatus(18, "Скачивание ${clientJarFile.name}...")
        downloadFileIfNeeded(
            clientObj.getString("url"),
            clientJarFile,
            clientObj.optString("sha1", "")
        )

        val librariesArray = versionJson.optJSONArray("libraries") ?: JSONArray()
        val totalLibs = librariesArray.length().coerceAtLeast(1)
        for (i in 0 until librariesArray.length()) {
            val libObj = librariesArray.getJSONObject(i)
            if (!isLibraryAllowedOnAndroid(libObj)) continue

            val artifact = libObj.optJSONObject("downloads")?.optJSONObject("artifact") ?: continue
            val path = artifact.optString("path", "")
            val url = artifact.optString("url", "")
            val sha1 = artifact.optString("sha1", "")
            if (path.isNotEmpty() && url.isNotEmpty()) {
                downloadFileIfNeeded(url, File(librariesDir, path), sha1)
            }
            val pct = 18 + (((i + 1) * 42) / totalLibs)
            if (i % 6 == 0 || i == librariesArray.length() - 1) {
                onStatus(pct, "Библиотеки: ${i + 1}/$totalLibs")
            }
        }

        val assetIndexObj = versionJson.optJSONObject("assetIndex")
        if (assetIndexObj != null) {
            val indexId = assetIndexObj.getString("id")
            val indexUrl = assetIndexObj.getString("url")
            val indexFile = File(assetsIndexesDir, "$indexId.json")

            onStatus(64, "Загрузка индекса ассетов $indexId...")
            val indexText = downloadText(indexUrl)
            indexFile.writeText(indexText, Charsets.UTF_8)

            val objectsMap = JSONObject(indexText).optJSONObject("objects")
            if (objectsMap != null) {
                val keysIterator = objectsMap.keys()
                val keyList = ArrayList<String>()
                while (keysIterator.hasNext()) keyList.add(keysIterator.next())

                val totalAssets = keyList.size.coerceAtLeast(1)
                for (i in keyList.indices) {
                    val objEntry = objectsMap.getJSONObject(keyList[i])
                    val hash = objEntry.getString("hash")
                    val prefix = hash.substring(0, 2)
                    val objectFile = File(assetsObjectsDir, "$prefix/$hash")
                    val objectUrl = "$ASSETS_BASE_URL/$prefix/$hash"

                    downloadFileIfNeeded(objectUrl, objectFile, hash)

                    if (i % 30 == 0 || i == keyList.lastIndex) {
                        val pct = 64 + (((i + 1) * 36) / totalAssets)
                        onStatus(pct, "Ассеты: ${i + 1}/$totalAssets")
                    }
                }
            }
        }

        onStatus(100, "Готово: пакеты сохранены в ${gameDir.absolutePath}")
    }

    private fun isLibraryAllowedOnAndroid(libObj: JSONObject): Boolean {
        val rules = libObj.optJSONArray("rules") ?: return true
        var allowed = false
        for (i in 0 until rules.length()) {
            val rule = rules.getJSONObject(i)
            val action = rule.getString("action")
            val osName = rule.optJSONObject("os")?.optString("name", "")
            val matchesOs = osName.isNullOrEmpty() || osName == "linux" || osName == "osx"
            if (matchesOs) {
                allowed = (action == "allow")
            }
        }
        return allowed
    }

    private fun downloadText(url: String): String {
        val req = Request.Builder().url(url).build()
        httpClient.newCall(req).execute().use { resp ->
            if (!resp.isSuccessful) throw IllegalStateException("HTTP ${resp.code} ($url)")
            return resp.body?.string() ?: throw IllegalStateException("Пустой ответ ($url)")
        }
    }

    private fun downloadFileIfNeeded(url: String, targetFile: File, expectedSha1: String) {
        if (targetFile.exists() && targetFile.length() > 0L) {
            if (expectedSha1.isBlank() || sha1Of(targetFile).equals(expectedSha1, ignoreCase = true)) {
                return
            }
        }

        targetFile.parentFile?.mkdirs()
        val tempFile = File(targetFile.parentFile, "${targetFile.name}.tmp")
        val req = Request.Builder().url(url).build()

        httpClient.newCall(req).execute().use { resp ->
            if (!resp.isSuccessful) throw IllegalStateException("HTTP ${resp.code} ($url)")
            val body = resp.body ?: throw IllegalStateException("Нет тела ответа ($url)")
            body.byteStream().use { input: InputStream ->
                FileOutputStream(tempFile, false).use { out ->
                    val buf = ByteArray(BUFFER_SIZE)
                    while (true) {
                        val read = input.read(buf)
                        if (read == -1) break
                        out.write(buf, 0, read)
                    }
                    out.flush()
                }
            }
        }

        if (expectedSha1.isNotBlank()) {
            val actual = sha1Of(tempFile)
            if (!actual.equals(expectedSha1, ignoreCase = true)) {
                tempFile.delete()
                throw IllegalStateException("Ошибка SHA-1 для ${targetFile.name}")
            }
        }

        if (targetFile.exists()) targetFile.delete()
        if (!tempFile.renameTo(targetFile)) {
            tempFile.copyTo(targetFile, overwrite = true)
            tempFile.delete()
        }
    }

    private fun sha1Of(file: File): String {
        val digest = MessageDigest.getInstance("SHA-1")
        val buf = ByteArray(BUFFER_SIZE)
        file.inputStream().use { input ->
            while (true) {
                val read = input.read(buf)
                if (read == -1) break
                digest.update(buf, 0, read)
            }
        }
        return digest.digest().joinToString("") { "%02x".format(it) }
    }
}

class RuntimeBootstrapper(
    private val context: Context,
    private val gameRootDir: File
) {
    companion object {
        private const val BUFFER_SIZE = 16 * 1024
        private val REQUIRED_NATIVE_LIBS = listOf(
            "libgl4es_114.so",
            "liblwjgl.so",
            "liblwjgl_opengl.so",
            "liblwjgl_glfw.so"
        )
    }

    fun resolveJavaMajor(versionId: String): Int {
        val minor = versionId.split(".").getOrNull(1)?.toIntOrNull() ?: 20
        return when {
            minor >= 21 -> 21
            minor >= 18 -> 17
            else -> 8
        }
    }

    fun inspectRuntime(javaMajor: Int): String {
        val arm64 = Build.SUPPORTED_ABIS.any { it.equals("arm64-v8a", ignoreCase = true) }
        val runtimeDir = File(context.filesDir, "runtimes/jre$javaMajor")
        val nativesDir = File(context.filesDir, "natives/arm64-v8a")
        nativesDir.mkdirs()

        val javaBin = File(runtimeDir, "bin/java")
        val hasJava = javaBin.exists() && javaBin.length() > 0L
        if (hasJava && !javaBin.canExecute()) {
            javaBin.setExecutable(true)
        }

        val missingLibs = REQUIRED_NATIVE_LIBS.filter { libName ->
            val f = File(nativesDir, libName)
            !f.exists() || f.length() == 0L
        }

        val abiLabel = if (arm64) "ARM64 OK" else "ABI!"
        val jreLabel = if (hasJava) "JRE$javaMajor OK" else "JRE$javaMajor нет"
        val libsLabel = if (missingLibs.isEmpty()) "SO OK" else "SO не хватает: ${missingLibs.size}"
        return "$abiLabel • $jreLabel • $libsLabel"
    }

    fun extractTarGzFromAssetsIfPresent(assetTarGzName: String, javaMajor: Int): File? {
        val assetsList = context.assets.list("") ?: emptyArray()
        if (!assetsList.contains(assetTarGzName)) return null

        val targetDir = File(context.filesDir, "runtimes/jre$javaMajor")
        val markerFile = File(targetDir, ".installed_ok")
        val javaBin = File(targetDir, "bin/java")

        if (markerFile.exists() && javaBin.exists()) {
            javaBin.setExecutable(true)
            return targetDir
        }

        targetDir.mkdirs()
        context.assets.open(assetTarGzName).use { rawIn ->
            GZIPInputStream(BufferedInputStream(rawIn, BUFFER_SIZE)).use { gzIn ->
                extractTarStream(gzIn, targetDir)
            }
        }
        if (javaBin.exists()) javaBin.setExecutable(true)
        markerFile.writeText("ok", Charsets.UTF_8)
        return targetDir
    }

    fun buildJvmCommandPreview(versionId: String, playerName: String, ramMb: Int): List<String> {
        val javaMajor = resolveJavaMajor(versionId)
        val nativesDir = File(context.filesDir, "natives/arm64-v8a")
        val safeMinMb = (ramMb / 3).coerceIn(256, 768)
        return listOf(
            File(context.filesDir, "runtimes/jre$javaMajor/bin/java").absolutePath,
            "-Xms${safeMinMb}m",
            "-Xmx${ramMb}m",
            "-XX:+UseG1GC",
            "-XX:MaxGCPauseMillis=40",
            "-Djava.library.path=${nativesDir.absolutePath}",
            "-Dorg.lwjgl.opengl.libname=${File(nativesDir, "libgl4es_114.so").absolutePath}",
            "-cp",
            "${File(gameRootDir, "versions/$versionId/$versionId.jar").absolutePath}:${File(gameRootDir, "libraries").absolutePath}",
            "net.minecraft.client.main.Main",
            "--username", playerName,
            "--version", versionId,
            "--gameDir", gameRootDir.absolutePath
        )
    }

    private fun extractTarStream(input: InputStream, destDir: File) {
        val header = ByteArray(512)
        val buffer = ByteArray(BUFFER_SIZE)

        while (true) {
            if (readExact(input, header, 512) < 512) break
            if (header.all { it.toInt() == 0 }) break

            val rawName = String(header, 0, 100, Charsets.UTF_8).trim { it <= ' ' || it == '\u0000' }
            val rawPrefix = String(header, 345, 155, Charsets.UTF_8).trim { it <= ' ' || it == '\u0000' }
            val fullName = if (rawPrefix.isNotEmpty()) "$rawPrefix/$rawName" else rawName
            val typeFlag = header[156].toInt().toChar()

            val sizeOctal = String(header, 124, 12, Charsets.UTF_8).trim { it <= ' ' || it == '\u0000' || it == '0' }
            val entrySize = if (sizeOctal.isEmpty()) 0L else sizeOctal.toLongOrNull(8) ?: 0L

            val cleanName = fullName.removePrefix("./").removePrefix("/")
            if (cleanName.isNotEmpty()) {
                val outFile = File(destDir, cleanName)
                if (outFile.canonicalPath.startsWith(destDir.canonicalPath)) {
                    if (typeFlag == '5' || cleanName.endsWith("/")) {
                        outFile.mkdirs()
                    } else if (typeFlag == '0' || typeFlag == '\u0000') {
                        outFile.parentFile?.mkdirs()
                        FileOutputStream(outFile, false).use { fos ->
                            var remaining = entrySize
                            while (remaining > 0) {
                                val toRead = minOf(remaining, buffer.size.toLong()).toInt()
                                val read = input.read(buffer, 0, toRead)
                                if (read == -1) break
                                fos.write(buffer, 0, read)
                                remaining -= read.toLong()
                            }
                            fos.flush()
                        }
                    }
                }
            }

            val padded = ((entrySize + 511L) / 512L) * 512L
            skipBytesStream(input, padded - entrySize)
        }
    }

    private fun readExact(input: InputStream, out: ByteArray, length: Int): Int {
        var total = 0
        while (total < length) {
            val read = input.read(out, total, length - total)
            if (read == -1) break
            total += read
        }
        return total
    }

    private fun skipBytesStream(input: InputStream, count: Long) {
        var left = count
        val buf = ByteArray(BUFFER_SIZE)
        while (left > 0) {
            val toRead = minOf(left, buf.size.toLong()).toInt()
            val read = input.read(buf, 0, toRead)
            if (read == -1) break
            left -= read.toLong()
        }
    }
}

