            background = buttonDrawable("#4C1D95", "#C084FC")
            val lp = LinearLayout.LayoutParams(
                ViewGroup.LayoutParams.WRAP_CONTENT,
                ViewGroup.LayoutParams.WRAP_CONTENT
            ).apply {
                leftMargin = dp(8)
            }
            layoutParams = lp
            setOnClickListener { releaseAllTouchButtons() }
        }

        toolbarRow.addView(scaleBtn)
        toolbarRow.addView(releaseBtn)

        touchOverlayContainer = FrameLayout(this).apply {
            setBackgroundColor(Color.parseColor("#0C0618"))
            val lp = LinearLayout.LayoutParams(
                ViewGroup.LayoutParams.MATCH_PARENT,
                dp(230)
            ).apply {
                topMargin = dp(10)
            }
            layoutParams = lp
        }

        buildMobileTouchPad(touchOverlayContainer)

        val hotbarScroll = HorizontalScrollView(this).apply {
            val lp = LinearLayout.LayoutParams(
                ViewGroup.LayoutParams.MATCH_PARENT,
                ViewGroup.LayoutParams.WRAP_CONTENT
            ).apply {
                topMargin = dp(10)
            }
            layoutParams = lp
        }

        val hotbarRow = LinearLayout(this).apply {
            orientation = LinearLayout.HORIZONTAL
        }
        for (slot in 1..9) {
            val slotBtn = Button(this).apply {
                text = "$slot"
                textSize = 12f
                setTextColor(Color.WHITE)
                background = buttonDrawable("#2E1065", "#A855F7")
                val lp = LinearLayout.LayoutParams(dp(42), dp(40)).apply {
                    rightMargin = dp(4)
                }
                layoutParams = lp
                setOnClickListener {
                    keyStateLabel.text = "Слот хотбара: $slot (GLFW_KEY_${48 + slot})"
                }
            }
            hotbarRow.addView(slotBtn)
        }
        hotbarScroll.addView(hotbarRow)

        controlsCard.addView(controlsHeader)
        controlsCard.addView(keyStateLabel)
        controlsCard.addView(toolbarRow)
        controlsCard.addView(touchOverlayContainer)
        controlsCard.addView(hotbarScroll)

        mainColumn.addView(titleText)
        mainColumn.addView(subText)
        mainColumn.addView(configCard)
        mainColumn.addView(controlsCard)
        scrollRoot.addView(mainColumn)
        setContentView(scrollRoot)

        refreshRuntimeBadge(bootstrapper)
        loadRemoteVersionManifest(bootstrapper, gameDir)
    }

    private fun refreshRuntimeBadge(bootstrapper: RuntimeBootstrapper) {
        val selectedId = versionsList.getOrNull(versionSpinner.selectedItemPosition)?.id ?: "1.21.4"
        val major = bootstrapper.resolveJavaMajor(selectedId)
        runtimeStatusLabel.text = "Среда: ${bootstrapper.inspectRuntime(major)}"
    }

    private fun buildMobileTouchPad(container: FrameLayout) {
        container.removeAllViews()
        touchButtons.clear()

        val dpadGrid = GridLayout(this).apply {
            columnCount = 3
            rowCount = 3
            val lp = FrameLayout.LayoutParams(
                ViewGroup.LayoutParams.WRAP_CONTENT,
                ViewGroup.LayoutParams.WRAP_CONTENT,
                Gravity.BOTTOM or Gravity.START
            ).apply {
                marginStart = dp(10)
                bottomMargin = dp(10)
            }
            layoutParams = lp
        }

        val cells = arrayOf<GameInputAction?>(
            null, GameInputAction.MOVE_FORWARD, null,
            GameInputAction.MOVE_LEFT, GameInputAction.MOVE_BACK, GameInputAction.MOVE_RIGHT,
            null, GameInputAction.SNEAK, null
        )

        for (cell in cells) {
            if (cell == null) {
                val spacer = View(this).apply {
                    layoutParams = GridLayout.LayoutParams().apply {
                        width = dp(46)
                        height = dp(46)
                        setMargins(dp(3), dp(3), dp(3), dp(3))
                    }
                }
                dpadGrid.addView(spacer)
            } else {
                val btn = MobileGameTouchButton(this, cell, this).apply {
                    layoutParams = GridLayout.LayoutParams().apply {
                        width = dp(46)
                        height = dp(46)
                        setMargins(dp(3), dp(3), dp(3), dp(3))
                    }
                }
                touchButtons.add(btn)
                dpadGrid.addView(btn)
            }
        }

        val rightActions = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            val lp = FrameLayout.LayoutParams(
                ViewGroup.LayoutParams.WRAP_CONTENT,
                ViewGroup.LayoutParams.WRAP_CONTENT,
                Gravity.BOTTOM or Gravity.END
            ).apply {
                marginEnd = dp(10)
                bottomMargin = dp(10)
            }
            layoutParams = lp
        }

        val topRow = LinearLayout(this).apply {
            orientation = LinearLayout.HORIZONTAL
        }

        val lmbBtn = MobileGameTouchButton(this, GameInputAction.ATTACK_LMB, this).apply {
            layoutParams = LinearLayout.LayoutParams(dp(58), dp(46)).apply {
                rightMargin = dp(6)
            }
        }
        val rmbBtn = MobileGameTouchButton(this, GameInputAction.USE_RMB, this).apply {
            layoutParams = LinearLayout.LayoutParams(dp(58), dp(46))
        }
        topRow.addView(lmbBtn)
        topRow.addView(rmbBtn)
        touchButtons.add(lmbBtn)
        touchButtons.add(rmbBtn)

        val jumpBtn = MobileGameTouchButton(this, GameInputAction.JUMP, this).apply {
            layoutParams = LinearLayout.LayoutParams(dp(122), dp(46)).apply {
                topMargin = dp(6)
            }
        }
        touchButtons.add(jumpBtn)

        rightActions.addView(topRow)
        rightActions.addView(jumpBtn)

        val invBtn = MobileGameTouchButton(this, GameInputAction.INVENTORY, this).apply {
            layoutParams = FrameLayout.LayoutParams(dp(64), dp(36), Gravity.TOP or Gravity.END).apply {
                topMargin = dp(10)
                marginEnd = dp(10)
            }
        }
        touchButtons.add(invBtn)

        container.addView(dpadGrid)
        container.addView(rightActions)
        container.addView(invBtn)
    }

    private fun applyPadScale() {
        for (btn in touchButtons) {
            btn.scaleX = padScale
            btn.scaleY = padScale
        }
    }

    private fun releaseAllTouchButtons() {
        for (btn in touchButtons) {
            btn.forceRelease()
        }
        activeKeys.clear()
        updateKeyStateText()
    }

    override fun onGameActionStateChanged(action: GameInputAction, isPressed: Boolean) {
        if (isPressed) activeKeys.add(action) else activeKeys.remove(action)
        updateKeyStateText()
    }

    private fun updateKeyStateText() {
        keyStateLabel.text = if (activeKeys.isEmpty()) {
            "Активные клавиши: НЕТ"
        } else {
            "Активные клавиши: " + activeKeys.joinToString(" + ") { "${it.label} (${it.lwjglCode})" }
        }
    }

    private fun loadRemoteVersionManifest(bootstrapper: RuntimeBootstrapper, gameDir: File) {
        ioExecutor.execute {
            try {
                val remote = MojangPackageDownloader(gameDir)
                    .fetchVersionList()
                    .filter { it.type == "release" }
                    .take(40)
                if (remote.isNotEmpty()) {
                    mainHandler.post {
                        versionsList = remote
                        bindVersionsToSpinner()
                        refreshRuntimeBadge(bootstrapper)
                        statusLabel.text = "Статус: загружен список релизов Mojang (${remote.size})"
                    }
                }
            } catch (e: Exception) {
                mainHandler.post {
                    statusLabel.text = "Статус: офлайн/резервный список (${e.message ?: "нет сети"})"
                }
            }
        }
    }

    private fun bindVersionsToSpinner() {
        val labels = versionsList.map { "${it.id} (${it.type})" }
        versionSpinner.adapter = ArrayAdapter(
            this,
            android.R.layout.simple_spinner_dropdown_item,
            labels
        )
    }

    private fun startPackagePreparation(bootstrapper: RuntimeBootstrapper, gameDir: File) {
        if (isBusy) return
        val selected = versionsList.getOrNull(versionSpinner.selectedItemPosition) ?: return
        if (selected.url.isBlank()) {
            statusLabel.text = "Ошибка: нет ссылки на манифест версии ${selected.id}."
            return
        }

        val nick = nickInput.text.toString().trim().ifEmpty { "VoidPlayer" }
        val ramMb = 768 + ramSeekBar.progress
        val major = bootstrapper.resolveJavaMajor(selected.id)

        isBusy = true
        launchButton.isEnabled = false
        progressBar.progress = 0
        statusLabel.text = "Статус: запуск подготовки ${selected.id} для $nick ($ramMb MB)..."

        ioExecutor.execute {
            try {
                bootstrapper.extractTarGzFromAssetsIfPresent("jre$major-arm64.tar.gz", major)
                val downloader = MojangPackageDownloader(gameDir)
                downloader.prepareVersionPackages(selected) { pct, msg ->
                    mainHandler.post {
                        progressBar.progress = pct
                        statusLabel.text = "[$pct%] $msg"
                    }
                }
                val cmdPreview = bootstrapper.buildJvmCommandPreview(selected.id, nick, ramMb)
                mainHandler.post {
                    refreshRuntimeBadge(bootstrapper)
                    statusLabel.text = "Готово (${selected.id}) в ${gameDir.absolutePath}: команд ${cmdPreview.size}, RAM ${ramMb}MB, ник $nick"
                    isBusy = false
                    launchButton.isEnabled = true
                }
            } catch (e: Exception) {
                mainHandler.post {
                    statusLabel.text = "Ошибка: ${e.message ?: "сбой сети/диска"}"
                    isBusy = false
                    launchButton.isEnabled = true
                }
            }
        }
    }

    private fun computeSafeMaxRamMb(): Int {
        val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
        val info = ActivityManager.MemoryInfo()
        am.getMemoryInfo(info)
        val totalMb = (info.totalMem / (1024L * 1024L)).toInt()
        return when {
            totalMb <= 4096 -> 1280
            totalMb <= 6144 -> 1792
            totalMb <= 8192 -> 2304
            else -> 3072
        }
    }

    private fun cardDrawable(fillHex: String, strokeHex: String): GradientDrawable =
        GradientDrawable().apply {
            cornerRadius = dp(20).toFloat()
            setColor(Color.parseColor(fillHex))
            setStroke(dp(2), Color.parseColor(strokeHex))
        }

    private fun buttonDrawable(fillHex: String, strokeHex: String): GradientDrawable =
        GradientDrawable().apply {
            cornerRadius = dp(14).toFloat()
            setColor(Color.parseColor(fillHex))
            setStroke(dp(2), Color.parseColor(strokeHex))
        }

    private fun dp(value: Int): Int = (value * resources.displayMetrics.density).toInt()

    override fun onPause() {
        releaseAllTouchButtons()
        super.onPause()
    }

    override fun onDestroy() {
        releaseAllTouchButtons()
        ioExecutor.shutdownNow()
        super.onDestroy()
    }
}
